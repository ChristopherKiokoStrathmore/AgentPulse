name: Capstone liquidity analysis checks
on:
  push:
    paths:
      - 'analysis/**'
      - '.github/workflows/capstone-checks.yml'
  pull_request:
    paths:
      - 'analysis/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q test_decision_analysis.py
      - run: python decision_analysis.py --out results
